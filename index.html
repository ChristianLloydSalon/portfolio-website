    <!-- Apply the saved theme before first paint to avoid a theme flash. -->
    <script>
      (function () {
        var theme = 'dusk'; // default; a saved choice wins
        try {
          var saved = localStorage.getItem('cs:theme');
          if (saved === 'sunset') saved = 'sunrise'; // renamed theme
          if (saved === 'sunrise' || saved === 'dusk') theme = saved;
        } catch (e) {}
        var root = document.documentElement;
        root.setAttribute('data-theme', theme);
        root.style.colorScheme = theme === 'dusk' ? 'dark' : 'light';
        var meta = document.getElementById('meta-theme-color');
        if (meta) meta.setAttribute('content', theme === 'dusk' ? '#10182B' : '#E8F2F3');
      })();
    </script>
  </head>
  <body>
    <!-- At build time scripts/prerender.mjs fills #root with the rendered page, so crawlers get full content. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
